name: party-logo-web-branch-qa

on:
  push:
    branches:
      - feat/party-logo-candidacy-1

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          ELECT_BACKEND_URL: https://backend.invalid
          ELECT_BFF_SECRET: ci-bff-secret
